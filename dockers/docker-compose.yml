services:
  api:
    container_name: ka-doe
    build:
      context: ..
      dockerfile: dockers/Dockerfile
      tags:
        - ka-doe:${TAG:-latest}
    image: ka-doe:${TAG:-latest}
    ports:
      - "${KADOE_PORT:-8000}:8000"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health_check/get_status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
